<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹캠 뱀게임 · Teachable Machine</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: #11151c; color: #e6e9ef;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px;
  }
  h1 { margin: 0 0 14px; font-size: 1.5rem; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .panel { background: #1a2029; border-radius: 12px; padding: 16px; }
  #game { display: block; background: #0b0e13; border-radius: 8px; max-width: 100%; }
  .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.05rem; }
  .side { width: 260px; display: flex; flex-direction: column; gap: 12px; }
  #webcam-container { width: 224px; height: 224px; border-radius: 8px; overflow: hidden; background: #000; margin: 0 auto; }
  #webcam-container canvas { width: 100%; height: 100%; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: .9rem; margin: 4px 0; }
  .bar .name { width: 44px; }
  .bar .track { flex: 1; height: 14px; background: #2a3240; border-radius: 7px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: #4f8cff; transition: width .08s; }
  .bar.active .fill { background: #3ddc84; }
  .bar .pct { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  #current { text-align: center; font-size: 2rem; font-weight: 700; height: 2.4rem; }
  button {
    width: 100%; padding: 10px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 8px; cursor: pointer;
    background: #4f8cff; color: #fff;
  }
  button:disabled { background: #39414f; color: #8a93a3; cursor: default; }
  label { font-size: .9rem; display: block; }
  input[type=range] { width: 100%; }
  #status { font-size: .85rem; color: #9aa4b5; min-height: 1.2em; }
  .hint { font-size: .8rem; color: #7d8696; line-height: 1.5; }
</style>
</head>
<body>
<h1>🐍 웹캠으로 조종하는 뱀게임</h1>

<div class="wrap">
  <div class="panel">
    <div class="hud">
      <span>점수: <b id="score">0</b></span>
      <span>최고: <b id="best">0</b></span>
    </div>
    <canvas id="game" width="480" height="480"></canvas>
  </div>

  <div class="panel side">
    <button id="camBtn">📷 웹캠 & 모델 시작</button>
    <div id="status">버튼을 눌러 웹캠을 켜세요.</div>
    <div id="webcam-container"></div>
    <div id="current">–</div>
    <div id="bars"></div>

    <label>인식 임계값: <span id="thVal">0.80</span>
      <input type="range" id="threshold" min="0.5" max="0.99" step="0.01" value="0.8">
    </label>
    <label>속도: <span id="spdVal">보통</span>
      <input type="range" id="speed" min="1" max="5" step="1" value="3">
    </label>

    <button id="startBtn">▶ 게임 시작</button>
    <div class="hint">
      left / right / up / down 포즈로 방향을 바꾸고, neut 일 때는 현재 방향을 유지합니다.<br>
      키보드 방향키도 함께 쓸 수 있어요. (Space: 시작/일시정지)
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
// ===================== Teachable Machine =====================
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/kHqrwGEzw/";
const DIRS = {
  up:    { x: 0,  y: -1, arrow: "⬆️" },
  down:  { x: 0,  y: 1,  arrow: "⬇️" },
  left:  { x: -1, y: 0,  arrow: "⬅️" },
  right: { x: 1,  y: 0,  arrow: "➡️" },
};

let model, webcam, labels = [], barEls = [];
const statusEl = document.getElementById("status");
const currentEl = document.getElementById("current");
const thInput = document.getElementById("threshold");

document.getElementById("camBtn").addEventListener("click", initModel);

async function initModel() {
  const btn = document.getElementById("camBtn");
  btn.disabled = true;
  try {
    statusEl.textContent = "모델 불러오는 중...";
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    labels = model.getClassLabels();

    statusEl.textContent = "웹캠 켜는 중...";
    webcam = new tmImage.Webcam(224, 224, true); // flip = true (거울 모드)
    await webcam.setup();
    await webcam.play();
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    buildBars();
    statusEl.textContent = "준비 완료! 클래스: " + labels.join(", ");
    btn.textContent = "✅ 웹캠 실행 중";
    requestAnimationFrame(predictLoop);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "오류: " + (e.message || e) + " (localhost/https에서 실행했는지 확인)";
    btn.disabled = false;
  }
}

function buildBars() {
  const box = document.getElementById("bars");
  box.innerHTML = "";
  barEls = labels.map(name => {
    const row = document.createElement("div");
    row.className = "bar";
    row.innerHTML = `<span class="name">${name}</span><div class="track"><div class="fill"></div></div><span class="pct">0%</span>`;
    box.appendChild(row);
    return { row, fill: row.querySelector(".fill"), pct: row.querySelector(".pct") };
  });
}

async function predictLoop() {
  webcam.update();
  const preds = await model.predict(webcam.canvas);
  let best = preds[0];
  preds.forEach((p, i) => {
    if (p.probability > best.probability) best = p;
    barEls[i].fill.style.width = (p.probability * 100).toFixed(0) + "%";
    barEls[i].pct.textContent = (p.probability * 100).toFixed(0) + "%";
    barEls[i].row.classList.remove("active");
  });

  const label = best.className.trim().toLowerCase();
  const th = parseFloat(thInput.value);
  if (best.probability >= th) {
    barEls[preds.indexOf(best)].row.classList.add("active");
    if (DIRS[label]) {
      currentEl.textContent = DIRS[label].arrow + " " + label;
      requestDirection(label);
    } else {
      currentEl.textContent = "⏺ " + label; // neut
    }
  } else {
    currentEl.textContent = "…";
  }
  requestAnimationFrame(predictLoop);
}

thInput.addEventListener("input", () => {
  document.getElementById("thVal").textContent = (+thInput.value).toFixed(2);
});

// ===================== Snake Game =====================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELLS = 20;
const SIZE = canvas.width / CELLS;
const SPEEDS = [null, 260, 200, 150, 110, 80];
const SPEED_NAMES = [null, "아주 느림", "느림", "보통", "빠름", "아주 빠름"];

let snake, dir, nextDir, food, score, running = false, gameOver = false, timer = null;
let best = +(localStorage.getItem("snakeBest") || 0);
document.getElementById("best").textContent = best;

const speedInput = document.getElementById("speed");
speedInput.addEventListener("input", () => {
  document.getElementById("spdVal").textContent = SPEED_NAMES[speedInput.value];
  if (running) restartTimer();
});

function resetGame() {
  const mid = Math.floor(CELLS / 2);
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  dir = DIRS.right;
  nextDir = dir;
  score = 0;
  gameOver = false;
  document.getElementById("score").textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function requestDirection(name) {
  const d = DIRS[name];
  // 180도 반대 방향으로는 꺾을 수 없음
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return endGame();

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = "#0b0e13";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자
  ctx.strokeStyle = "#151a22";
  for (let i = 0; i <= CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
  }

  // 먹이
  ctx.fillStyle = "#ff5c6c";
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE * 0.4, 0, Math.PI * 2);
  ctx.fill();

  // 뱀
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#3ddc84" : "#2aa866";
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

function drawMessage(title, sub) {
  draw();
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 36px 'Malgun Gothic', sans-serif";
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = "18px 'Malgun Gothic', sans-serif";
  ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 26);
}

function restartTimer() {
  clearInterval(timer);
  timer = setInterval(step, SPEEDS[speedInput.value]);
}

function endGame() {
  running = false;
  gameOver = true;
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem("snakeBest", best);
    document.getElementById("best").textContent = best;
  }
  drawMessage("GAME OVER", `점수 ${score} · 시작 버튼으로 다시 하기`);
  startBtn.textContent = "🔄 다시 시작";
}

const startBtn = document.getElementById("startBtn");
startBtn.addEventListener("click", toggleGame);

function toggleGame() {
  if (running) {
    running = false;
    clearInterval(timer);
    drawMessage("일시정지", "다시 누르면 계속");
    startBtn.textContent = "▶ 계속";
    return;
  }
  if (gameOver || !snake) resetGame();
  running = true;
  startBtn.textContent = "⏸ 일시정지";
  draw();
  restartTimer();
  startBtn.blur();
}

// 키보드 보조 조작
document.addEventListener("keydown", e => {
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (map[e.key]) { e.preventDefault(); if (running) requestDirection(map[e.key]); }
  if (e.code === "Space") { e.preventDefault(); toggleGame(); }
});

resetGame();
drawMessage("SNAKE", "웹캠을 켜고 게임 시작을 누르세요");
</script>
</body>
</html>
